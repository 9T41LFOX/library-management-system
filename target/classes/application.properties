spring.application.name=library-management-system
server.port=8080

# File-based H2 so book records (and their PDF file references) survive an
# application restart, matching the on-disk PDF files under library.upload.pdf-dir.
spring.datasource.url=jdbc:h2:file:./data/librarydb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false

# Multipart upload limits - large enough for a scanned book PDF.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Tomcat's own connector-level POST size cap defaults to just 2MB and is
# checked BEFORE the spring.servlet.multipart limits above - without raising
# it too, an upload over ~2MB gets its connection reset instead of a graceful
# error response.
server.tomcat.max-http-form-post-size=100MB
server.tomcat.max-swallow-size=100MB

# Library business rules (already referenced via @Value in BorrowServiceImpl
# and DashboardServiceImpl - this file did not exist in the uploaded project).
library.borrow.max-books=3
library.borrow.period-days=15
library.fine.per-day=2.00

# Where uploaded book PDFs are stored on disk. Created automatically if
# missing, and served at /uploads/pdf/** via WebConfig.
library.upload.pdf-dir=uploads/pdf
