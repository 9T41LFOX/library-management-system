<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title=${book.title})}"></head>
<body>
<div class="lh-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <div class="lh-main">
        <nav th:replace="~{fragments/layout :: navbar}"></nav>
        <div class="lh-content">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h2 class="mb-1" th:text="${book.title}">Book Title</h2>
                    <p class="text-muted mb-0" th:text="|by ${book.author}|">by Author</p>
                </div>
                <a th:href="@{/books}" class="btn btn-outline-secondary btn-sm">&larr; Back to catalog</a>
            </div>

            <div th:if="${book.pdfFileName != null}" class="lh-card p-2">
                <iframe th:src="@{/uploads/pdf/{file}(file=${book.pdfFileName})}" style="width: 100%; height: 80vh; border: 0;"
                        title="PDF reader"></iframe>
            </div>

            <div th:if="${book.pdfFileName == null}" class="alert alert-warning mb-0">
                PDF not available for this book yet.
            </div>

        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
