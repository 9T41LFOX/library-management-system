<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(title='Categories')}"></head>
<body>
<div class="lh-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <div class="lh-main">
        <nav th:replace="~{fragments/layout :: navbar}"></nav>
        <div class="lh-content">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-1">Categories</h2>
                    <p class="text-muted mb-0">Organize your collection by subject.</p>
                </div>
                <a th:href="@{/admin/categories/new}" class="btn btn-primary">+ Add Category</a>
            </div>

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div class="lh-card p-3 mb-3">
                <form th:action="@{/admin/categories}" method="get" class="d-flex gap-2">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Search categories...">
                    <button type="submit" class="btn btn-outline-primary">Search</button>
                </form>
            </div>

            <div class="lh-card">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                            <tr><th>Name</th><th># Books</th><th class="text-end">Actions</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="category : ${categories.content}">
                                <td th:text="${category.name}">Fiction</td>
                                <td th:text="${category.books.size()}">0</td>
                                <td class="text-end">
                                    <a th:href="@{/admin/categories/{id}/edit(id=${category.id})}" class="btn btn-sm btn-outline-secondary">Edit</a>
                                    <form th:action="@{/admin/categories/{id}/delete(id=${category.id})}" method="post" class="d-inline"
                                          onsubmit="return confirm('Delete this category?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${categories.content.isEmpty()}">
                                <td colspan="3" class="text-center text-muted py-4">No categories yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="p-3" th:if="${categories.totalPages > 1}">
                    <nav th:replace="~{fragments/pagination :: pager(page=${categories}, baseUrl='/admin/categories', keyword=${keyword})}"></nav>
                </div>
            </div>

        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
