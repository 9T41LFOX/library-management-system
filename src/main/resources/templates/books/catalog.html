<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Read Books')}"></head>
<body>
<div class="lh-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <div class="lh-main">
        <nav th:replace="~{fragments/layout :: navbar}"></nav>
        <div class="lh-content">

            <div class="mb-4">
                <h2 class="mb-1">Read Books</h2>
                <p class="text-muted mb-0">Browse the catalog and open any book that has a digital copy attached.</p>
            </div>

            <div class="lh-card p-3 mb-3">
                <form th:action="@{/books}" method="get" class="d-flex gap-2">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control"
                           placeholder="Search by title or author...">
                    <button type="submit" class="btn btn-outline-primary">Search</button>
                </form>
            </div>

            <div class="lh-card">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Author</th>
                                <th>Category</th>
                                <th class="text-end">Digital Copy</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="book : ${books.content}">
                                <td th:text="${book.title}">Title</td>
                                <td th:text="${book.author}">Author</td>
                                <td th:text="${book.category != null ? book.category.name : '-'}">Category</td>
                                <td class="text-end">
                                    <a th:if="${book.pdfFileName != null}" th:href="@{/books/{id}/read(id=${book.id})}"
                                       class="btn btn-primary btn-sm">Read Book</a>
                                    <span th:if="${book.pdfFileName == null}" class="text-muted small">PDF not available</span>
                                </td>
                            </tr>
                            <tr th:if="${books.content.isEmpty()}">
                                <td colspan="4" class="text-center text-muted py-4">No books found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="p-3" th:if="${books.totalPages > 1}">
                    <nav th:replace="~{fragments/pagination :: pager(page=${books}, baseUrl='/books', keyword=${keyword})}"></nav>
                </div>
            </div>

        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
