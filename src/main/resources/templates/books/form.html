<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Book')}"></head>
<body>
<div class="lh-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <div class="lh-main">
        <nav th:replace="~{fragments/layout :: navbar}"></nav>
        <div class="lh-content">

            <h2 class="mb-4" th:text="${bookForm.id != null ? 'Edit Book' : 'Add Book'}">Add Book</h2>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div class="lh-card p-4" style="max-width: 640px;">
                <form th:action="@{/admin/books/save}" th:object="${bookForm}" method="post"
                      enctype="multipart/form-data" class="needs-validation" novalidate>
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" class="form-control" th:field="*{title}" required
                               th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Author</label>
                        <input type="text" class="form-control" th:field="*{author}" required
                               th:classappend="${#fields.hasErrors('author')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">ISBN</label>
                        <input type="text" class="form-control" th:field="*{isbn}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Quantity</label>
                        <input type="number" min="1" class="form-control" th:field="*{quantity}" required
                               th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select class="form-select" th:field="*{categoryId}" required
                                th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid'">
                            <option value="">-- Select Category --</option>
                            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Suppliers</label>
                        <select class="form-select" th:field="*{supplierIds}" multiple size="4">
                            <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}"></option>
                        </select>
                        <div class="form-text">Hold Ctrl (Cmd on Mac) to select more than one.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Book PDF (for online reading)</label>
                        <input type="file" class="form-control" th:field="*{pdfFile}" accept="application/pdf">
                        <div class="form-text" th:if="${book != null and book.pdfFileName != null}">
                            A PDF is already attached to this book. Choose a new file only if you want to replace it.
                        </div>
                        <div class="form-text" th:if="${book == null or book.pdfFileName == null}">
                            Optional. Only PDF files are accepted.
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Save</button>
                    <a th:href="@{/admin/books}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>

        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
