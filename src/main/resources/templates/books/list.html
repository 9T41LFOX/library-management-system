<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Books')}"></head>
<body>
<div class="lh-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <div class="lh-main">
        <nav th:replace="~{fragments/layout :: navbar}"></nav>
        <div class="lh-content">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-1">Books</h2>
                    <p class="text-muted mb-0">Manage the catalog, stock levels, and reading copies.</p>
                </div>
                <a th:href="@{/admin/books/new}" class="btn btn-primary">+ Add Book</a>
            </div>

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div class="lh-card p-3 mb-3">
                <form th:action="@{/admin/books}" method="get" class="d-flex gap-2">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control"
                           placeholder="Search by title or author...">
                    <button type="submit" class="btn btn-outline-primary">Search</button>
                </form>
            </div>

            <div class="lh-card">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Author</th>
                                <th>ISBN</th>
                                <th>Category</th>
                                <th>Qty</th>
                                <th>Available</th>
                                <th>PDF</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="book : ${books.content}">
                                <td th:text="${book.title}">Title</td>
                                <td th:text="${book.author}">Author</td>
                                <td th:text="${book.isbn ?: '-'}">ISBN</td>
                                <td th:text="${book.category != null ? book.category.name : '-'}">Category</td>
                                <td th:text="${book.quantity}">0</td>
                                <td th:text="${book.availableQuantity}">0</td>
                                <td>
                                    <span class="badge badge-gold" th:if="${book.pdfFileName != null}">Attached</span>
                                    <span class="text-muted small" th:if="${book.pdfFileName == null}">&mdash;</span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{/admin/books/{id}/edit(id=${book.id})}"
                                       class="btn btn-outline-secondary btn-sm">Edit</a>
                                    <form th:action="@{/admin/books/{id}/delete(id=${book.id})}" method="post"
                                          class="d-inline" onsubmit="return confirm('Delete this book?');">
                                        <button type="submit" class="btn btn-outline-danger btn-sm">Delete</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${books.content.isEmpty()}">
                                <td colspan="8" class="text-center text-muted py-4">No books yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="p-3" th:if="${books.totalPages > 1}">
                    <nav th:replace="~{fragments/pagination :: pager(page=${books}, baseUrl='/admin/books', keyword=${keyword})}"></nav>
                </div>
            </div>

        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
