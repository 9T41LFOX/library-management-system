<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title=${member.name})}"></head>
<body>
<div class="lh-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <div class="lh-main">
        <nav th:replace="~{fragments/layout :: navbar}"></nav>
        <div class="lh-content">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-1" th:text="${member.name}">Member Name</h2>
                    <p class="text-muted mb-0" th:text="|Member since ${#temporals.format(member.joinDate, 'MMM d, yyyy')}|">Joined</p>
                </div>
                <a th:href="@{/admin/members}" class="btn btn-outline-secondary btn-sm">&larr; Back to members</a>
            </div>

            <div class="lh-card p-4 mb-3" style="max-width: 480px;">
                <dl class="row mb-0">
                    <dt class="col-4 text-muted">Email</dt>
                    <dd class="col-8" th:text="${member.email ?: '-'}">Email</dd>
                    <dt class="col-4 text-muted">Phone</dt>
                    <dd class="col-8" th:text="${member.phone ?: '-'}">Phone</dd>
                    <dt class="col-4 text-muted">Address</dt>
                    <dd class="col-8 mb-0" th:text="${member.address ?: '-'}">Address</dd>
                </dl>
            </div>

            <div class="lh-card">
                <div class="p-3 border-bottom">
                    <h5 class="mb-0">Borrow History</h5>
                </div>
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Book</th>
                                <th>Issued</th>
                                <th>Due</th>
                                <th>Returned</th>
                                <th>Fine</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="b : ${member.borrows}">
                                <td th:text="${b.book.title}">Book</td>
                                <td th:text="${#temporals.format(b.issueDate, 'MMM d, yyyy')}">Date</td>
                                <td th:text="${#temporals.format(b.dueDate, 'MMM d, yyyy')}">Date</td>
                                <td th:text="${b.returnDate != null ? #temporals.format(b.returnDate, 'MMM d, yyyy') : '-'}">-</td>
                                <td th:text="|$${b.fine}|">$0</td>
                                <td>
                                    <span class="badge badge-issued" th:if="${b.status.name() == 'ISSUED'}">Issued</span>
                                    <span class="badge badge-returned" th:if="${b.status.name() == 'RETURNED'}">Returned</span>
                                </td>
                            </tr>
                            <tr th:if="${member.borrows.isEmpty()}">
                                <td colspan="6" class="text-center text-muted py-4">No borrow history yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
