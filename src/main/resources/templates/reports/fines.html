<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Fine Collection')}"></head>
<body>
<div class="lh-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <div class="lh-main">
        <nav th:replace="~{fragments/layout :: navbar}"></nav>
        <div class="lh-content">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-1">Fine Collection</h2>
                    <p class="text-muted mb-0" th:text="|Total collected: $${totalFines}|">Total</p>
                </div>
                <a th:href="@{/admin/reports}" class="btn btn-outline-secondary btn-sm">&larr; Back to reports</a>
            </div>

            <div class="lh-card">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Member</th>
                                <th>Book</th>
                                <th>Due Date</th>
                                <th>Returned</th>
                                <th>Fine</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="b : ${borrows}">
                                <td th:text="${b.member.name}">Member</td>
                                <td th:text="${b.book.title}">Book</td>
                                <td th:text="${#temporals.format(b.dueDate, 'MMM d, yyyy')}">Date</td>
                                <td th:text="${b.returnDate != null ? #temporals.format(b.returnDate, 'MMM d, yyyy') : '-'}">-</td>
                                <td th:text="|$${b.fine}|">$0</td>
                            </tr>
                            <tr th:if="${borrows.isEmpty()}">
                                <td colspan="5" class="text-center text-muted py-4">No fines on record.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
