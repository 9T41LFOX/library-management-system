<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(title='Return Book')}"></head>
<body>
<div class="lh-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <div class="lh-main">
        <nav th:replace="~{fragments/layout :: navbar}"></nav>
        <div class="lh-content">

            <h2 class="mb-1">Return Book</h2>
            <p class="text-muted mb-4">Every book currently checked out. Overdue rows are highlighted.</p>

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div class="lh-card">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                            <tr><th>Member</th><th>Book</th><th>Issued</th><th>Due</th><th>Status</th><th class="text-end">Action</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="b : ${borrows}" th:classappend="${b.dueDate.isBefore(today)} ? 'table-danger'">
                                <td th:text="${b.member.name}">Member</td>
                                <td th:text="${b.book.title}">Book</td>
                                <td th:text="${#temporals.format(b.issueDate, 'MMM d, yyyy')}">Date</td>
                                <td th:text="${#temporals.format(b.dueDate, 'MMM d, yyyy')}">Date</td>
                                <td>
                                    <span class="badge badge-overdue" th:if="${b.dueDate.isBefore(today)}">Overdue</span>
                                    <span class="badge badge-issued" th:unless="${b.dueDate.isBefore(today)}">On time</span>
                                </td>
                                <td class="text-end">
                                    <form th:action="@{/admin/return/{id}(id=${b.id})}" method="post" class="d-inline"
                                          onsubmit="return confirm('Mark this book as returned?');">
                                        <button type="submit" class="btn btn-sm btn-primary">Return</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${borrows.isEmpty()}">
                                <td colspan="6" class="text-center text-muted py-4">Nothing is currently checked out.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
